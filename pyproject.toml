[project]
name = "rssapi"
version = "0.4.7"
description = "RSS subscription tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx[http2,socks]",
  "hypercorn",
  "typer",
  "pyyaml",
  "oss2",
  "python-dateutil",
  "xmltodict",
  "beautifulsoup4",
  "yagmail",
  "python-multipart",
  "pyjwt",
  "dateparser",
  "psutil",
  "feedgen",
  "pytz",
  "cloudscraper",
  "pydantic-settings",
  "cachetools",
  "minify-html",
  "asyncache",
  "mini-racer",
  "markdown",
  "curl-cffi",
  "proto-plus",
  "google-api-python-client>=2.190.0",
  "twitter-cli==0.8.4",
  "githubkit",
  "rdt-cli>=0.4.1",
  "playwright",
]

[dependency-groups]
dev = [
  "pytest",
  "mypy",
  "pre-commit",
  "ipython",
  "pretty-errors",
  "pytest-playwright",
  "types-cachetools",
  "pytest-asyncio",
  "types-dateparser",
  "pip",
  "types-beautifulsoup4",
  "types-xmltodict",
  "types-python-dateutil",
  "ruff",
  "types-pyyaml",
  "pretty-errors>=1.2.25",
  "ai-assistant",
  "tox-uv",
]

[project.scripts]
rssapi-server = "rssapi.main:cmd"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["rssapi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
# Same as Black.
line-length = 119
indent-width = 4

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
# docstring-code-line-length = "dynamic"
# [build-system]
# requires = ["poetry-core>=1.0.0"]
# build-backend = "poetry.core.masonry.api"
[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
exclude = ['^venv/', '^__init__\.py$']
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "exception.*",
  "routers.*",
  "responses.*",
  "schemas.*",
  "settings.*",
  "models.*",
  "utils.*",
  "uvicorn",
  "oss2",
  "yaml.*",
  "xmltodict",
  "yagmail",
  "bs4",
  "deps",
  "PyJWT",
  "main",
  "pytz",
  "feedgen.*",
  "cloudscraper",
  "requests.*",
  "pydantic_settings",
  "events.*",
  "cachetools.*",
  "minify_html",
  "middlewares.*",
  "asyncache.*",
  "py_mini_racer",
  "markdown",
  "markdown.*",
  "psutil",
  "curl_cffi",
  "playwright.*",
  "proto.*",
  "googleapiclient.*",
  "twitter_cli",
  "twitter_cli.*",
  "ai_assistant",
  "ai_assistant.*",
  "githubkit",
  "githubkit.*",
  "rdt_cli.*",
]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
markers = ["nga_delay: add a delay before running the marked tests.d')"]

[tool.uv.sources]
ai-assistant = { git = "https://github.com/qsoyq/ai-assistant.git", rev = "0.3.3" }

[tool.isort]
profile = "hug"
src_paths = ["rssapi"]

[tool.tox]
requires = ["tox>=4.21", "tox-uv>=1.16"]
env_list = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.tox.env_run_base]
description = "verify rssapi-server starts on Python {base_python}"
runner = "uv-venv-lock-runner"
dependency_groups = ["dev"]
set_env = { PYTHONWARNINGS = "ignore:urllib3" }
commands = [["rssapi-server", "--help"]]
